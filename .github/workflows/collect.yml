name: Gold Pilot Collector 5m

on:
  push:
    branches: [main]
    paths:
      - collector.mjs
      - .github/workflows/collect.yml
  workflow_dispatch:
  schedule:
    # Co 5 minut, z przesunięciem od pełnej godziny aby ograniczyć opóźnienia GitHub Actions.
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-pilot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Pobierz kod kolektora
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pobierz poprzednią historię z gałęzi data
        shell: bash
        run: |
          set -e
          rm -f /tmp/gold-pilot-prev.json
          if git fetch origin data:refs/remotes/origin/data; then
            git show refs/remotes/origin/data:data/history.json > /tmp/gold-pilot-prev.json || true
          fi

      - name: Zbierz dane rynkowe i dealerów
        id: collect
        shell: bash
        run: |
          set +e
          OUT_DIR=/tmp/gold-pilot-out PREVIOUS_FILE=/tmp/gold-pilot-prev.json node collector.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Opublikuj najnowszą historię w gałęzi data
        shell: bash
        run: |
          set -e
          test -f /tmp/gold-pilot-out/history.json
          test -f /tmp/gold-pilot-out/latest.json
          test -f /tmp/gold-pilot-out/health.json

          git config user.name "Gold Pilot Cloud"
          git config user.email "gold-pilot-cloud@users.noreply.github.com"

          git switch --orphan data-publish
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          cp /tmp/gold-pilot-out/history.json data/history.json
          cp /tmp/gold-pilot-out/latest.json data/latest.json
          cp /tmp/gold-pilot-out/health.json data/health.json

          cat > index.html <<'HTML'
          <!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Pilot Cloud</title><body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0f14;color:#eee;padding:24px"><h1>Gold Pilot Cloud</h1><p>Dane zbierane automatycznie przez GitHub Actions.</p><ul><li><a style="color:#e2bf62" href="data/latest.json">latest.json</a></li><li><a style="color:#e2bf62" href="data/history.json">history.json</a></li><li><a style="color:#e2bf62" href="data/health.json">health.json</a></li></ul></body></html>
          HTML

          git add data index.html
          git commit -m "Gold Pilot data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin HEAD:data

      - name: Oceń stan źródeł krytycznych
        shell: bash
        run: |
          code='${{ steps.collect.outputs.exit_code }}'
          if [ "$code" != "0" ]; then
            echo "Kolektor zapisał dane diagnostyczne, ale brakowało krytycznego źródła."
            exit "$code"
          fi
          echo "Gold Pilot Cloud: OK"
